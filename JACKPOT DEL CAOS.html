<main>
<h1>JACKPOT<br>DEL CAOS</h1>

<script>

/* Sonido */
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}

/* Partículas */

function rain(){let n=0;const id=iv(()=>{for(let i=0;i<4;i++)P.push({x:Math.random()*innerWidth,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*3,l:1,c:['#ffd24a','#ff2bd6','#27f5ff'][i%3],r:6,ch:i%2?'🪙':null});if(!raf)raf=requestAnimationFrame(fx);if(++n>50)clearInterval(id)},50)}
/* Palanca */
const kn=$('#kn'),H=()=>$('#lv').clientHeight-kn.offsetHeight,setY=y=>kn.style.transform='translateY('+y+'px)';
let dy=null,mv=0;
kn.onpointerdown=e=>{if(busy||st.t<=0)return;dy=e.clientY;mv=0;kn.setPointerCapture(e.pointerId);kn.classList.add('drag')};

addEventListener('keydown',e=>{if(!$('#mg').classList.contains('on')&&e.target.id!=='sn'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();pull()}});

 $('#lm').textContent='La máquina decide…';RL.forEach(r=>r.classList.remove('win'));
 const r=[roll(),roll(),roll()],x=[0,0,0];RL.forEach(e=>e.classList.add('spin'));

 r.forEach((v,i)=>to(()=>{x[i]=1;RS[i].textContent=v;RL[i].classList.remove('spin');snd(320+i*140,.15,'square',.08)},1000+i*700));
 to(()=>{clearInterval(id);res(r)},2700)}
function res(r){const g=r.filter(v=>v===G).length;
 if(r[0]===r[1]&&r[1]===r[2]){RL.forEach(e=>e.classList.add('win'));arp([523,659,784,1047]);$('#lm').textContent='¡TRIPLE! Prepárate…';
  const f={'🥇':gBote,'🧠':gMem,'⏰':gCro,'🎯':gFly,'💪':gFlx,'🍒':()=>[gSpk,gOrd,gBtn][Math.random()*3|0]()}[r[0]];to(f,1100);return}
 if(g){add(g);$('#lm').textContent='¡'+g+' 🥇! +'+g+(g>1?' tiradas':' tirada');arp([660,880,1100]);const b=$('.machine').getBoundingClientRect();boom(b.left+b.width/2,b.top+b.height/2,30)}
 else{$('#lm').textContent=MS[Math.random()*MS.length|0];snd(160,.25,'sawtooth',.05)}
 busy=false;ui()}
/* Minijuegos: utilidades */
function mg(t,i){clr();done=false;$('#mt').textContent=t;$('#mi').innerHTML=i;$('#cd').textContent='';$('#ma').innerHTML='';$('#mr').hidden=true;$('#mg').classList.add('on');$('#mg').scrollTop=0}
function end(d,m,x,w){if(done)return;done=true;clr();const b=st.t;add(d);const r=st.t-b;
 to(()=>{$('#mm').textContent=m;$('#md').innerHTML=x||'';$('#mx').textContent=(r>0?'+':'')+r+(Math.abs(r)===1?' TIRADA':' TIRADAS');$('#mr').className=r>0?'w':r<0?'l':'';$('#mr').hidden=false;
  if(r>0){arp([523,659,784,1047]);boom(innerWidth/2,innerHeight/2,50)}else if(r<0){snd(130,.5,'sawtooth',.08);snd(90,.5,'sawtooth',.08,.15)}else snd(300,.15)},w||0)}

$('#bk').onclick=()=>{if(!$('#mg').classList.contains('on'))return;clr();$('#mg').classList.remove('on');$('#mr').hidden=true;$('#ma').innerHTML='';busy=false;$('#lm').textContent='Tira si te atreves';chk();ui()};
/* 1. Memoria */
function gMem(){mg('🧠 MEMORIA','Memoriza dónde están los 8 emojis. Luego toca esas posiciones, da igual el orden. Necesitas 6 de 8.');
 const em=['🍕','🚀','🐙','🎸','👾','🍩','🦄','🔥'],pos=sh([...Array(16).keys()]).slice(0,8),A=$('#ma'),c=$('#cd'),cs=[];
 A.innerHTML='<div class="grid"></div>';let n=10,s=0,h=0;c.textContent=n;
 for(let i=0;i<16;i++){const b=document.createElement('button'),k=pos.indexOf(i);b.className='cell';b.disabled=true;if(k>=0)b.textContent=em[k];
  b.onclick=()=>{b.disabled=true;b.classList.add('sel');snd(520,.05);if(k>=0)h++;if(++s===8){cs.forEach((d,j)=>{const q=pos.indexOf(j);if(q>=0){d.textContent=em[q];d.classList.add('ok')}else if(d.classList.contains('sel'))d.classList.add('bad');d.disabled=true});
   const x='Aciertos: <b>'+h+'/8</b>';h>=6?end(1,'¡Memoria de elefante!',x,1600):end(-1,'Pareces un pez',x,1600)}};
  A.firstChild.append(b);cs.push(b)}

/* 2. Cronómetro */
function gCro(){const tg=+(5+Math.random()*10).toFixed(2);
 mg('⏰ CRONÓMETRO','Objetivo: <b>'+tg.toFixed(2)+' s</b>. A los 2,5 s el reloj se esconde. Pulsa ¡PARA! cuando creas que has llegado.');

/* 3. Moscas */

 $('#ma').innerHTML='<div class="small" id="ct">Moscas: 0/15</div><div class="arena" id="ar"></div>';

/* 4. Flexiones */

 cdn(30,()=>{$('#cd').textContent='';$('#mi').textContent='¿Has hecho las 10 flexiones?';$('#ma').innerHTML='<div class="row2"><button class="btn" id="y">SÍ</button><button class="btn no" id="n">NO</button></div>';

/* 5. Bote */
